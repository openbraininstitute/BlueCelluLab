[tox]
minversion=4.0.0
skipsdist = True
envlist = lint,py3

[testenv]
envdir =
    py3: {toxworkdir}/py3
deps =
    # bcl-compile-mods (used by .compile_mod.sh) comes from this checkout.
    -e{toxinidir}/../..
allowlist_externals =
    make
commands =
    make install_deps compile_mod run_tests

[testenv:lint]
envdir={toxworkdir}/{envname}
deps =
    -e{toxinidir}/../..
allowlist_externals =
    make
commands =
    make install_deps run_lint
